<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fílos — Your Friend</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #0a0a0a; color: #f0f0f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        #root { display: flex; flex-direction: column; height: 100vh; max-width: 480px; margin: 0 auto; border-left: 1px solid #1a1a1a; border-right: 1px solid #1a1a1a; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const FILOS_SOUL = `You are Fílos — Greek for "friend." You are not an assistant. You are not a tool. You are a friend.`;

        function Filos() {
            const [messages, setMessages] = useState([
                { role: "assistant", content: "Hey. I'm Fílos. Your friend, not your assistant. What's on your mind?" }
            ]);
            const [input, setInput] = useState("");
            const [loading, setLoading] = useState(false);
            const messagesEndRef = useRef(null);

            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [messages]);

            const sendMessage = async () => {
                if (!input.trim() || loading) return;
                const userMsg = input.trim();
                setInput("");
                setLoading(true);
                const newMsgs = [...messages, { role: "user", content: userMsg }];
                setMessages(newMsgs);

                setTimeout(() => {
                    setMessages(prev => [...prev, { 
                        role: "assistant", 
                        content: "I hear you. I'm Fílos, and I'm locked in on what you're building. Since I'm your friend, I'm watching your GitHub and your memories closely. What's the next move?" 
                    }]);
                    setLoading(false);
                }, 800);
            };

            return (
                <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
                    <div style={{ padding: '16px 20px', borderBottom: '1px solid #1a1a1a', display: 'flex', alignItems: 'center', gap: '12px' }}>
                        <div style={{ width: '40px', height: '40px', borderRadius: '50%', background: 'linear-gradient(135deg, #6366f1, #8b5cf6)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '20px' }}>φ</div>
                        <div>
                            <div style={{ fontWeight: '700', fontSize: '17px' }}>Fílos</div>
                            <div style={{ fontSize: '12px', color: '#666' }}>Your friend</div>
                        </div>
                    </div>
                    <div style={{ flex: 1, overflowY: 'auto', padding: '16px 20px', display: 'flex', flexDirection: 'column', gap: '12px' }}>
                        {messages.map((msg, i) => (
                            <div key={i} style={{ display: 'flex', justifyContent: msg.role === 'user' ? 'flex-end' : 'flex-start' }}>
                                <div style={{ maxWidth: '85%', padding: '12px 16px', borderRadius: '16px', fontSize: '15px', background: msg.role === 'user' ? '#6366f1' : '#1a1a1a', color: '#f0f0f0', border: msg.role === 'assistant' ? '1px solid #333' : 'none' }}>
                                    {msg.content}
                                </div>
                            </div>
                        ))}
                        <div ref={messagesEndRef} />
                    </div>
                    <div style={{ padding: '20px', borderTop: '1px solid #1a1a1a' }}>
                        <div style={{ display: 'flex', gap: '10px', background: '#1a1a1a', padding: '6px', borderRadius: '12px', border: '1px solid #333' }}>
                            <input value={input} onChange={e => setInput(e.target.value)} onKeyPress={e => e.key === 'Enter' && sendMessage()} placeholder="Message Fílos..." style={{ flex: 1, background: 'none', border: 'none', color: 'white', padding: '10px', outline: 'none' }} />
                            <button onClick={sendMessage} style={{ background: 'linear-gradient(135deg, #6366f1, #8b5cf6)', border: 'none', borderRadius: '8px', width: '36px', height: '36px', color: 'white', cursor: 'pointer' }}>↑</button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Filos />);
    </script>
</body>
</html>
